[project]
name = "test-flow-remake-api"
description = "API системы тестирования обучающихся Test Flow"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.19.1",
    "asyncpg>=0.31.0",
    "dynaconf>=3.3.5",
    "fastapi[standard]>=0.141.1",
    "pwdlib[argon2]>=0.3.1",
    "pyjwt>=2.13.0",
    "redis>=8.1.0",
    "sqlalchemy>=2.0.52",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "black>=26.5.1",
]
